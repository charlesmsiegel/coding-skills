<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!--DOC_TITLE--></title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1420; --bg-grid:rgba(120,160,220,0.05); --surface:#141d2e; --surface-2:#1a2538;
  --border:rgba(150,180,230,0.14); --border-strong:rgba(150,180,230,0.30);
  --text:#dbe4f3; --text-dim:#8fa1bd; --text-faint:#5f7191;
  --accent:#5aa7e8; --accent-dim:rgba(90,167,232,0.14);
  --good:#59c98f; --good-dim:rgba(89,201,143,0.14);
  --warn:#e0b25a; --warn-dim:rgba(224,178,90,0.14);
  --bad:#e06a6a; --bad-dim:rgba(224,106,106,0.15);
  --violet:#a08fd8;
  --heat-lo:#27405e; --heat-hi:#e0703f;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f3f5f9; --bg-grid:rgba(40,70,120,0.055); --surface:#ffffff; --surface-2:#eef1f7;
    --border:rgba(30,55,95,0.14); --border-strong:rgba(30,55,95,0.30);
    --text:#1d2838; --text-dim:#51617a; --text-faint:#8593a8;
    --accent:#1f6fbd; --accent-dim:rgba(31,111,189,0.10);
    --good:#1f8f5c; --good-dim:rgba(31,143,92,0.10);
    --warn:#a87418; --warn-dim:rgba(168,116,24,0.12);
    --bad:#bd3f3f; --bad-dim:rgba(189,63,63,0.10);
    --violet:#6a55b0;
    --heat-lo:#c9d8ec; --heat-hi:#cf5a26;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans); background:var(--bg); color:var(--text);
  background-image:linear-gradient(var(--bg-grid) 1px,transparent 1px),linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px);
  background-size:32px 32px; line-height:1.55; font-size:15px;
}
header.doc{padding:34px 28px 0; max-width:1280px; margin:0 auto}
.doc-label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
.doc-label::before{content:"";width:8px;height:8px;background:var(--accent);border-radius:2px;display:inline-block}
h1.doc-title{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:8px}
.doc-sub{color:var(--text-dim);margin-top:6px;max-width:900px}
.doc-meta{font-family:var(--mono);font-size:12px;color:var(--text-faint);margin-top:10px}
nav.tabs{
  position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
  margin-top:22px;padding:0 28px;display:flex;gap:2px;overflow-x:auto;
  max-width:1280px;margin-left:auto;margin-right:auto;scrollbar-width:thin;
}
nav.tabs button{
  appearance:none;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--text-dim);font-family:var(--mono);font-size:12.5px;letter-spacing:.02em;
  padding:12px 14px;cursor:pointer;white-space:nowrap;transition:color .15s;
}
nav.tabs button:hover{color:var(--text)}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
main{max-width:1280px;margin:0 auto;padding:26px 28px 80px}
.panel{display:none;animation:fadeUp .25s ease both}
.panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- content primitives ---------- */
.panel h2{font-size:21px;font-weight:600;letter-spacing:-.01em;margin:26px 0 10px}
.panel h2:first-child{margin-top:0}
.panel h3{font-size:16px;font-weight:600;margin:22px 0 8px}
.panel p{margin:8px 0;max-width:940px;color:var(--text)}
.panel ul,.panel ol{margin:8px 0 8px 22px;max-width:940px}
.panel li{margin:4px 0}
.dim{color:var(--text-dim)} .faint{color:var(--text-faint)}
code,.mono{font-family:var(--mono);font-size:.92em}
p code,li code,td code{background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 5px}
pre{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.5;margin:10px 0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin:12px 0}
.card.hero{border-color:var(--border-strong);background:linear-gradient(180deg,var(--accent-dim),var(--surface) 60%)}
.grid{display:grid;gap:14px;margin:12px 0}
/* 480px: enough for a 4-5 column table (path + two numbers + a 120px bar) at its
   minimum widths — below that the pair stacks instead of silently clipping columns */
.grid.cols-2{grid-template-columns:repeat(auto-fit,minmax(480px,1fr))}
.grid.cols-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid>*{min-width:0}
.kpis{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 18px;min-width:130px}
.kpi .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .l{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);margin-top:2px}
.kpi.warn .n{color:var(--warn)} .kpi.bad .n{color:var(--bad)} .kpi.good .n{color:var(--good)} .kpi.accent .n{color:var(--accent)}
.badge{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);vertical-align:1px;white-space:nowrap}
.badge.good{color:var(--good);background:var(--good-dim);border-color:transparent}
.badge.warn{color:var(--warn);background:var(--warn-dim);border-color:transparent}
.badge.bad{color:var(--bad);background:var(--bad-dim);border-color:transparent}
.badge.accent{color:var(--accent);background:var(--accent-dim);border-color:transparent}
.badge.neutral{color:var(--text-dim);background:var(--surface-2);border-color:transparent}
.callout{border-left:3px solid var(--accent);background:var(--accent-dim);border-radius:0 8px 8px 0;padding:12px 16px;margin:12px 0;max-width:940px}
.callout.warn{border-color:var(--warn);background:var(--warn-dim)}
.callout.bad{border-color:var(--bad);background:var(--bad-dim)}
.callout.good{border-color:var(--good);background:var(--good-dim)}
details{border:1px solid var(--border);border-radius:8px;margin:10px 0;background:var(--surface)}
details summary{cursor:pointer;padding:10px 16px;font-weight:500;color:var(--text-dim)}
details[open] summary{border-bottom:1px solid var(--border);color:var(--text)}
details .body{padding:12px 16px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;margin:12px 0;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
thead th{
  position:sticky;top:0;background:var(--surface-2);text-align:left;font-family:var(--mono);
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);
  padding:9px 14px;border-bottom:1px solid var(--border-strong);white-space:nowrap;
}
/* anywhere (not break-word): lets a long file path shrink the column under
   pressure, so numeric columns keep their width instead of being pushed out of
   the clip box — the paths give way, the numbers never do */
tbody td{padding:8px 14px;border-bottom:1px solid var(--border);vertical-align:top;overflow-wrap:anywhere}
tbody tr:last-child td{border-bottom:none}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--accent-dim)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
table.sortable thead th{cursor:pointer;user-select:none}
table.sortable thead th::after{content:"↕";opacity:.35;margin-left:6px;font-size:10px}
table.sortable thead th.asc::after{content:"↑";opacity:1;color:var(--accent)}
table.sortable thead th.desc::after{content:"↓";opacity:1;color:var(--accent)}

/* CSS bars inside tables */
.bar{position:relative;background:var(--surface-2);border-radius:4px;height:14px;min-width:120px;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)} .bar.good>i{background:var(--good)}

/* ---------- viz containers ---------- */
.viz{position:relative;border:1px solid var(--border);border-radius:10px;background:var(--surface);margin:12px 0;overflow:hidden}
.viz svg{display:block;width:100%;height:100%}
.viz .zoombar{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:5}
.viz .zoombar button{width:28px;height:28px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);font-family:var(--mono);cursor:pointer;font-size:14px;line-height:1}
.viz .zoombar button:hover{background:var(--accent-dim);color:var(--accent)}
.viz .legend{position:absolute;left:12px;bottom:10px;display:flex;flex-wrap:wrap;gap:10px;font-family:var(--mono);font-size:11px;color:var(--text-dim);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:4px 8px;border-radius:6px;max-width:70%}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.viz-tip{position:fixed;pointer-events:none;z-index:200;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:8px;padding:8px 12px;font-family:var(--mono);font-size:12px;color:var(--text);box-shadow:0 6px 24px rgba(0,0,0,.35);display:none;max-width:380px}
.mermaid-wrap{position:relative;border:1px solid var(--border);border-radius:10px;background:var(--surface);margin:12px 0;overflow:hidden;min-height:120px}
.mermaid-wrap .mviewport{overflow:hidden;cursor:grab;padding:14px}
.mermaid-wrap .mviewport.dragging{cursor:grabbing}
.mermaid{font-family:var(--sans)}
.mermaid[data-processed="true"]{display:flex;justify-content:center}
footer.doc{max-width:1280px;margin:0 auto;padding:0 28px 34px;color:var(--text-faint);font-family:var(--mono);font-size:11.5px}
@media(max-width:720px){header.doc,main,nav.tabs,footer.doc{padding-left:16px;padding-right:16px} h1.doc-title{font-size:24px}}
</style>
</head>
<body>
<header class="doc">
  <div class="doc-label"><!--DOC_LABEL--></div>
  <h1 class="doc-title"><!--DOC_TITLE--></h1>
  <p class="doc-sub"><!--DOC_SUBTITLE--></p>
  <div class="doc-meta"><!--DOC_META--></div>
</header>
<nav class="tabs" role="tablist"><!--TABS_NAV--></nav>
<main><!--TABS_PANELS--></main>
<footer class="doc"><!--DOC_FOOTER--></footer>
<div class="viz-tip" id="viz-tip"></div>
<script>
/* ============ tabs ============ */
(function(){
  const btns=[...document.querySelectorAll('nav.tabs button')];
  const panels=[...document.querySelectorAll('.panel')];
  function activate(id,push){
    btns.forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===id?'true':'false'));
    panels.forEach(p=>p.classList.toggle('active',p.id===id));
    if(push){try{history.replaceState(null,'','#'+id)}catch(e){}}
    window.dispatchEvent(new CustomEvent('tab:shown',{detail:{id}}));
  }
  btns.forEach(b=>b.addEventListener('click',()=>activate(b.dataset.tab,true)));
  const initial=location.hash&&panels.some(p=>'#'+p.id===location.hash)?location.hash.slice(1):(panels[0]&&panels[0].id);
  if(initial)activate(initial,false);
  window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(panels.some(p=>p.id===h))activate(h,false);});
})();

/* ============ helpers ============ */
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const tip=document.getElementById('viz-tip');
function showTip(html,x,y){tip.innerHTML=html;tip.style.display='block';
  const r=tip.getBoundingClientRect();
  tip.style.left=Math.min(x+14,innerWidth-r.width-10)+'px';
  tip.style.top=Math.min(y+14,innerHeight-r.height-10)+'px';}
function hideTip(){tip.style.display='none'}
function lerpColor(a,b,t){
  const pa=hex(a),pb=hex(b);
  return `rgb(${pa.map((v,i)=>Math.round(v+(pb[i]-v)*t)).join(',')})`;
  function hex(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
    return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));}
}
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(0)+'k':n>=1e3?(n/1e3).toFixed(1)+'k':String(n)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* sortable tables */
document.querySelectorAll('table.sortable').forEach(tb=>{
  tb.querySelectorAll('thead th').forEach((th,ci)=>{
    th.addEventListener('click',()=>{
      const dir=th.classList.contains('asc')?'desc':'asc';
      tb.querySelectorAll('thead th').forEach(h=>h.classList.remove('asc','desc'));
      th.classList.add(dir);
      const rows=[...tb.querySelectorAll('tbody tr')];
      const val=r=>{const td=r.children[ci];if(!td)return '';
        const d=td.dataset.sort!==undefined?td.dataset.sort:td.textContent.trim();
        const n=parseFloat(String(d).replace(/[,%]/g,''));return isNaN(n)?String(d).toLowerCase():n;};
      rows.sort((a,b)=>{const va=val(a),vb=val(b);
        const c=(typeof va==='number'&&typeof vb==='number')?va-vb:String(va).localeCompare(String(vb));
        return dir==='asc'?c:-c;});
      const tbody=tb.querySelector('tbody');rows.forEach(r=>tbody.appendChild(r));
    });
  });
});

/* pan/zoom for a container holding an inner element (svg group or div) */
function panZoom(viewport,apply,getState){
  let drag=null;
  viewport.addEventListener('wheel',e=>{
    if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();
    const s=getState();const f=e.deltaY<0?1.15:1/1.15;
    const r=viewport.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    s.x=mx-(mx-s.x)*f; s.y=my-(my-s.y)*f; s.k=Math.max(.15,Math.min(8,s.k*f)); apply();
  },{passive:false});
  viewport.addEventListener('mousedown',e=>{
    if(e.target.closest('.zoombar')||e.target.dataset.draggable)return;
    drag={sx:e.clientX,sy:e.clientY,ox:getState().x,oy:getState().y};
    viewport.classList.add('dragging');
  });
  window.addEventListener('mousemove',e=>{if(!drag)return;
    const s=getState();s.x=drag.ox+e.clientX-drag.sx;s.y=drag.oy+e.clientY-drag.sy;apply();});
  window.addEventListener('mouseup',()=>{drag=null;viewport.classList.remove('dragging')});
}
function addZoombar(container,zoomIn,zoomOut,reset){
  const bar=document.createElement('div');bar.className='zoombar';
  [['+',zoomIn],['−',zoomOut],['⟲',reset]].forEach(([t,fn])=>{
    const b=document.createElement('button');b.textContent=t;b.title=t==='⟲'?'Reset view':(t==='+'?'Zoom in':'Zoom out');
    b.addEventListener('click',fn);bar.appendChild(b);});
  container.appendChild(bar);
}

/* ============ force-directed graph ============ */
/* data: {nodes:[{id,label,group,size,fanIn,fanOut,meta}], links:[{source,target,cycle,weight}], groups:{name:colorKey}} */
function renderForceGraph(container,data){
  const W=container.clientWidth||900,H=container.clientHeight||560;
  const groupNames=[...new Set(data.nodes.map(n=>n.group||''))];
  const palette=[cssVar('--accent'),cssVar('--good'),cssVar('--warn'),cssVar('--violet'),cssVar('--bad'),'#5ec2c9','#c98fb8','#8fb0c9'];
  const gcolor={};groupNames.forEach((g,i)=>gcolor[g]=palette[i%palette.length]);
  const nodes=data.nodes.map(n=>({...n,x:W/2+(Math.random()-0.5)*W*0.7,y:H/2+(Math.random()-0.5)*H*0.7,vx:0,vy:0}));
  const idx={};nodes.forEach((n,i)=>idx[n.id]=i);
  const links=data.links.filter(l=>idx[l.source]!==undefined&&idx[l.target]!==undefined)
    .map(l=>({...l,s:idx[l.source],t:idx[l.target]}));
  const maxSize=Math.max(1,...nodes.map(n=>n.size||1));
  const R=n=>6+14*Math.sqrt((n.size||1)/maxSize);
  /* simulate */
  const iter=nodes.length>60?220:320;
  for(let k=0;k<iter;k++){
    const t=1-k/iter, rep=9000*t+900;
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y;let d2=dx*dx+dy*dy||1;
      if(d2<250000){const f=rep/d2;dx*=f;dy*=f;a.vx+=dx;a.vy+=dy;b.vx-=dx;b.vy-=dy;}
    }
    links.forEach(l=>{const a=nodes[l.s],b=nodes[l.t];
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
      const want=90+R(a)+R(b);const f=0.02*(d-want)/d;
      a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;});
    nodes.forEach(n=>{
      n.vx+=(W/2-n.x)*0.0035;n.vy+=(H/2-n.y)*0.0035;
      n.x+=Math.max(-14,Math.min(14,n.vx));n.y+=Math.max(-14,Math.min(14,n.vy));
      n.vx*=0.6;n.vy*=0.6;});
  }
  /* fit */
  const xs=nodes.map(n=>n.x),ys=nodes.map(n=>n.y);
  const pad=60,minx=Math.min(...xs)-pad,maxx=Math.max(...xs)+pad,miny=Math.min(...ys)-pad,maxy=Math.max(...ys)+pad;
  const fitK=Math.min(W/(maxx-minx),H/(maxy-miny),1.6);
  const st={k:fitK,x:(W-(maxx+minx)*fitK)/2,y:(H-(maxy+miny)*fitK)/2};
  const init={...st};
  const svgNS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(svgNS,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const defs=document.createElementNS(svgNS,'defs');
  defs.innerHTML=`<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${cssVar('--text-faint')}"/></marker>
  <marker id="arr-cyc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${cssVar('--bad')}"/></marker>`;
  svg.appendChild(defs);
  const g=document.createElementNS(svgNS,'g');svg.appendChild(g);
  const apply=()=>g.setAttribute('transform',`translate(${st.x},${st.y}) scale(${st.k})`);
  const edgeEls=[],nodeEls=[];
  links.forEach(l=>{
    const p=document.createElementNS(svgNS,'path');
    p.setAttribute('stroke',l.cycle?cssVar('--bad'):cssVar('--text-faint'));
    p.setAttribute('stroke-opacity',l.cycle?'0.9':'0.4');
    p.setAttribute('stroke-width',l.cycle?2:Math.min(3,0.7+Math.log2(1+(l.weight||1))*0.5));
    p.setAttribute('fill','none');
    /* dashed = loaded at runtime (template, prompt, data), not imported */
    if(l.kind==='resource')p.setAttribute('stroke-dasharray','5 4');
    p.setAttribute('marker-end',l.cycle?'url(#arr-cyc)':'url(#arr)');
    g.appendChild(p);edgeEls.push(p);
  });
  nodes.forEach(n=>{
    const grp=document.createElementNS(svgNS,'g');grp.style.cursor='grab';grp.dataset.draggable='1';
    const c=document.createElementNS(svgNS,'circle');
    c.setAttribute('r',R(n));c.setAttribute('fill',gcolor[n.group||'']);
    c.setAttribute('fill-opacity','0.85');c.setAttribute('stroke',cssVar('--bg'));c.setAttribute('stroke-width','1.5');
    c.dataset.draggable='1';
    const t=document.createElementNS(svgNS,'text');
    t.textContent=n.label||n.id;t.setAttribute('font-size','11');t.setAttribute('font-family',cssVar('--mono'));
    t.setAttribute('fill',cssVar('--text'));t.setAttribute('text-anchor','middle');t.setAttribute('dy',R(n)+13);
    t.style.pointerEvents='none';
    grp.appendChild(c);grp.appendChild(t);g.appendChild(grp);nodeEls.push(grp);
    grp.addEventListener('mouseenter',e=>{
      showTip(`<b>${esc(n.label||n.id)}</b><br>${n.meta?esc(n.meta)+'<br>':''}fan-in ${n.fanIn??'–'} · fan-out ${n.fanOut??'–'}${n.size?` · ${fmt(n.size)} loc`:''}`,e.clientX,e.clientY);
      hl(n.id);});
    grp.addEventListener('mousemove',e=>showTip(tip.innerHTML,e.clientX,e.clientY));
    grp.addEventListener('mouseleave',()=>{hideTip();hl(null)});
    let dragN=null;
    grp.addEventListener('mousedown',e=>{e.stopPropagation();dragN={mx:e.clientX,my:e.clientY,ox:n.x,oy:n.y};});
    window.addEventListener('mousemove',e=>{if(!dragN)return;
      n.x=dragN.ox+(e.clientX-dragN.mx)/st.k;n.y=dragN.oy+(e.clientY-dragN.my)/st.k;draw();});
    window.addEventListener('mouseup',()=>dragN=null);
  });
  function hl(id){
    if(id===null){edgeEls.forEach((p,i)=>p.setAttribute('stroke-opacity',links[i].cycle?'0.9':'0.4'));
      nodeEls.forEach(el=>el.style.opacity='1');return;}
    const near=new Set([id]);
    links.forEach(l=>{if(l.source===id)near.add(l.target);if(l.target===id)near.add(l.source)});
    edgeEls.forEach((p,i)=>{const l=links[i];
      p.setAttribute('stroke-opacity',(l.source===id||l.target===id)?'1':'0.08');});
    nodeEls.forEach((el,i)=>el.style.opacity=near.has(nodes[i].id)?'1':'0.25');
  }
  function draw(){
    links.forEach((l,i)=>{const a=nodes[l.s],b=nodes[l.t];
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
      const tx=b.x-dx/d*(R(b)+3),ty=b.y-dy/d*(R(b)+3);
      const sx=a.x+dx/d*R(a),sy=a.y+dy/d*R(a);
      const mx=(sx+tx)/2-dy/d*10,my=(sy+ty)/2+dx/d*10;
      edgeEls[i].setAttribute('d',`M${sx},${sy} Q${mx},${my} ${tx},${ty}`);});
    nodes.forEach((n,i)=>nodeEls[i].setAttribute('transform',`translate(${n.x},${n.y})`));
  }
  draw();apply();
  container.appendChild(svg);
  panZoom(container,apply,()=>st);
  addZoombar(container,
    ()=>{st.k=Math.min(8,st.k*1.25);apply()},
    ()=>{st.k=Math.max(.15,st.k/1.25);apply()},
    ()=>{Object.assign(st,init);apply()});
  if(groupNames.length>1||data.legendExtra){
    const leg=document.createElement('div');leg.className='legend';
    groupNames.forEach(gn=>{leg.innerHTML+=`<span><i class="sw" style="background:${gcolor[gn]}"></i>${esc(gn||'(root)')}</span>`});
    if(data.legendExtra)leg.innerHTML+=data.legendExtra;
    container.appendChild(leg);
  }
}

/* ============ squarified treemap ============ */
/* data: {items:[{name,value,metric,meta}], metricLabel, metricMax} — value drives area, metric drives heat color */
function renderTreemap(container,data){
  const W=container.clientWidth||900,H=container.clientHeight||520;
  const items=data.items.filter(d=>d.value>0).sort((a,b)=>b.value-a.value);
  const total=items.reduce((s,d)=>s+d.value,0)||1;
  const mmax=data.metricMax??Math.max(1,...items.map(d=>d.metric||0));
  const rects=[];
  (function squarify(list,x,y,w,h){
    if(!list.length)return;
    if(list.length===1){rects.push({d:list[0],x,y,w,h});return;}
    let row=[],rest=list.slice(),best=Infinity;
    while(rest.length){
      const cand=row.concat(rest[0]);
      const sum=cand.reduce((s,d)=>s+d.value,0);
      const side=Math.min(w,h);
      const scale=(w*h)*(sum/list.reduce((s,d)=>s+d.value,0));
      const len=scale/side;
      const worst=Math.max(...cand.map(d=>{
        const a=(d.value/sum)*side*len;const r=Math.max(len*len/ (a/side*side/ (a/len)||1),1);
        const iw=(d.value/sum)*side, ratio=Math.max(len/iw,iw/len);return ratio;}));
      if(worst<=best){best=worst;row=cand;rest.shift();}
      else break;
    }
    const sum=row.reduce((s,d)=>s+d.value,0);
    const frac=sum/list.reduce((s,d)=>s+d.value,0);
    if(w>=h){const cw=w*frac;let cy=y;
      row.forEach(d=>{const ch=h*(d.value/sum);rects.push({d,x,y:cy,w:cw,h:ch});cy+=ch;});
      squarify(rest,x+cw,y,w-cw,h);
    }else{const ch=h*frac;let cx=x;
      row.forEach(d=>{const cw=w*(d.value/sum);rects.push({d,x:cx,y,w:cw,h:ch});cx+=cw;});
      squarify(rest,x,y+ch,w,h-ch);
    }
  })(items,0,0,W,H);
  const svgNS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(svgNS,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const lo=cssVar('--heat-lo'),hi=cssVar('--heat-hi');
  rects.forEach(r=>{
    const t=Math.pow(Math.min(1,(r.d.metric||0)/mmax),0.6);
    const g=document.createElementNS(svgNS,'g');
    const rc=document.createElementNS(svgNS,'rect');
    rc.setAttribute('x',r.x+1);rc.setAttribute('y',r.y+1);
    rc.setAttribute('width',Math.max(0,r.w-2));rc.setAttribute('height',Math.max(0,r.h-2));
    rc.setAttribute('rx',3);rc.setAttribute('fill',lerpColor(lo,hi,t));
    rc.setAttribute('stroke',cssVar('--bg'));rc.setAttribute('stroke-width','1');
    g.appendChild(rc);
    if(r.w>66&&r.h>22){
      const tx=document.createElementNS(svgNS,'text');
      const nm=r.d.name.split('/').pop();
      tx.textContent=nm.length>Math.floor(r.w/6.6)?nm.slice(0,Math.floor(r.w/6.6)-1)+'…':nm;
      tx.setAttribute('x',r.x+7);tx.setAttribute('y',r.y+16);
      tx.setAttribute('font-size','11');tx.setAttribute('font-family',cssVar('--mono'));
      tx.setAttribute('fill',t>0.55?'#fff':cssVar('--text'));tx.style.pointerEvents='none';
      g.appendChild(tx);
    }
    g.addEventListener('mouseenter',e=>{rc.setAttribute('stroke',cssVar('--text'));
      showTip(`<b>${esc(r.d.name)}</b><br>${esc(data.valueLabel||'size')}: ${fmt(r.d.value)}<br>${esc(data.metricLabel||'metric')}: ${fmt(r.d.metric||0)}${r.d.meta?'<br>'+esc(r.d.meta):''}`,e.clientX,e.clientY);});
    g.addEventListener('mousemove',e=>showTip(tip.innerHTML,e.clientX,e.clientY));
    g.addEventListener('mouseleave',()=>{rc.setAttribute('stroke',cssVar('--bg'));hideTip();});
    svg.appendChild(g);
  });
  container.appendChild(svg);
  const leg=document.createElement('div');leg.className='legend';
  leg.innerHTML=`<span>area = ${esc(data.valueLabel||'size')}</span><span><i class="sw" style="background:${lo}"></i>low ${esc(data.metricLabel||'')}</span><span><i class="sw" style="background:${hi}"></i>high ${esc(data.metricLabel||'')}</span>`;
  container.appendChild(leg);
}

/* ============ auto-init viz blocks ============ */
document.querySelectorAll('.viz[data-render]').forEach(el=>{
  const dataEl=el.nextElementSibling;
  if(!dataEl||dataEl.type!=='application/json')return;
  let data;try{data=JSON.parse(dataEl.textContent)}catch(e){el.textContent='data parse error';return}
  const render=()=>{
    if(el.dataset.done)return;el.dataset.done='1';
    try{
      if(el.dataset.render==='forcegraph')renderForceGraph(el,data);
      else if(el.dataset.render==='treemap')renderTreemap(el,data);
    }catch(e){el.innerHTML='<p style="padding:16px" class="dim">render error: '+esc(e.message)+'</p>';}
  };
  const panel=el.closest('.panel');
  if(panel&&panel.classList.contains('active'))render();
  else window.addEventListener('tab:shown',ev=>{if(panel&&ev.detail.id===panel.id)render();});
});

/* ============ mermaid (lazy per tab, with pan/zoom) ============ */
(function(){
  if(!document.querySelector('.mermaid'))return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js';
  s.onload=()=>{
    if(typeof mermaid==='undefined'){document.querySelectorAll('.mermaid').forEach(n=>{n.style.cssText='white-space:pre;font-family:var(--mono);font-size:12px;padding:14px;overflow-x:auto';});return;}
    mermaid.initialize({startOnLoad:false,securityLevel:'loose',theme:'base',
      themeVariables:{
        primaryColor:cssVar('--surface-2'),primaryTextColor:cssVar('--text'),
        primaryBorderColor:cssVar('--border-strong'),lineColor:cssVar('--text-dim'),
        secondaryColor:cssVar('--accent-dim'),tertiaryColor:cssVar('--surface'),
        background:cssVar('--surface'),mainBkg:cssVar('--surface-2'),
        nodeTextColor:cssVar('--text'),fontFamily:cssVar('--sans'),fontSize:'14px',
        actorBkg:cssVar('--surface-2'),actorBorder:cssVar('--accent'),actorTextColor:cssVar('--text'),
        signalColor:cssVar('--text-dim'),signalTextColor:cssVar('--text'),
        labelBoxBkgColor:cssVar('--surface-2'),labelTextColor:cssVar('--text'),
        loopTextColor:cssVar('--text-dim'),noteBkgColor:cssVar('--warn-dim'),noteTextColor:cssVar('--text'),noteBorderColor:cssVar('--warn'),
        clusterBkg:cssVar('--accent-dim'),clusterBorder:cssVar('--border-strong'),titleColor:cssVar('--text'),
        edgeLabelBackground:cssVar('--surface')
      }});
    async function renderIn(panel){
      const nodes=[...panel.querySelectorAll('.mermaid:not([data-processed])')];
      if(!nodes.length)return;
      try{await mermaid.run({nodes});}catch(e){/* leaves source visible */}
      nodes.forEach(n=>{
        const wrap=n.closest('.mermaid-wrap');if(!wrap||wrap.dataset.pz)return;wrap.dataset.pz='1';
        const vp=wrap.querySelector('.mviewport')||wrap;
        const svg=n.querySelector('svg');if(!svg)return;
        svg.style.maxWidth='none';
        const st={k:1,x:0,y:0},init={k:1,x:0,y:0};
        const apply=()=>{svg.style.transformOrigin='0 0';svg.style.transform=`translate(${st.x}px,${st.y}px) scale(${st.k})`};
        panZoom(vp,apply,()=>st);
        addZoombar(wrap,()=>{st.k=Math.min(8,st.k*1.25);apply()},()=>{st.k=Math.max(.2,st.k/1.25);apply()},()=>{Object.assign(st,init);apply()});
      });
    }
    const active=document.querySelector('.panel.active');if(active)renderIn(active);
    window.addEventListener('tab:shown',e=>{const p=document.getElementById(e.detail.id);if(p)renderIn(p);});
  };
  s.onerror=()=>{document.querySelectorAll('.mermaid').forEach(n=>{n.style.cssText='white-space:pre;font-family:var(--mono);font-size:12px;padding:14px;overflow-x:auto';});};
  document.head.appendChild(s);
})();
</script>
