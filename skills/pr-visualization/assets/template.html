<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!--DOC_TITLE--></title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f2; --bg-grid:rgba(120,90,60,0.05); --surface:#ffffff; --surface-2:#f2ede4;
  --border:rgba(90,70,50,0.16); --border-strong:rgba(90,70,50,0.34);
  --text:#2b2620; --text-dim:#6d6357; --text-faint:#9a8f81;
  --accent:#8a5a2b; --accent-dim:rgba(138,90,43,0.10);
  --good:#3e7d4f; --good-dim:rgba(62,125,79,0.11);
  --warn:#a06b14; --warn-dim:rgba(160,107,20,0.12);
  --bad:#b04030; --bad-dim:rgba(176,64,48,0.10);
  --violet:#6a5590;
  --heat-lo:#e4dccd; --heat-hi:#b04030;
  --add:#3e7d4f; --add-dim:rgba(62,125,79,0.13);
  --del:#b04030; --del-dim:rgba(176,64,48,0.12);
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1c1915; --bg-grid:rgba(220,190,150,0.045); --surface:#26221c; --surface-2:#2f2a22;
    --border:rgba(220,195,160,0.14); --border-strong:rgba(220,195,160,0.30);
    --text:#e8e1d5; --text-dim:#a89c8b; --text-faint:#776d5f;
    --accent:#d3a161; --accent-dim:rgba(211,161,97,0.13);
    --good:#7bbd8b; --good-dim:rgba(123,189,139,0.13);
    --warn:#d9a84e; --warn-dim:rgba(217,168,78,0.14);
    --bad:#dd7a66; --bad-dim:rgba(221,122,102,0.14);
    --violet:#a893cf;
    --heat-lo:#3d372c; --heat-hi:#dd7a66;
    --add:#7bbd8b; --add-dim:rgba(123,189,139,0.14);
    --del:#dd7a66; --del-dim:rgba(221,122,102,0.14);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans); background:var(--bg); color:var(--text);
  background-image:linear-gradient(var(--bg-grid) 1px,transparent 1px),linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px);
  background-size:32px 32px; line-height:1.55; font-size:15px;
}
header.doc{padding:34px 28px 0; max-width:1280px; margin:0 auto}
.doc-label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
.doc-label::before{content:"";width:8px;height:8px;background:var(--accent);border-radius:2px;display:inline-block}
h1.doc-title{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:8px}
.doc-sub{color:var(--text-dim);margin-top:6px;max-width:900px}
.doc-meta{font-family:var(--mono);font-size:12px;color:var(--text-faint);margin-top:10px}
nav.tabs{
  position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
  margin-top:22px;padding:0 28px;display:flex;gap:2px;overflow-x:auto;
  max-width:1280px;margin-left:auto;margin-right:auto;scrollbar-width:thin;
}
nav.tabs button{
  appearance:none;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--text-dim);font-family:var(--mono);font-size:12.5px;letter-spacing:.02em;
  padding:12px 14px;cursor:pointer;white-space:nowrap;transition:color .15s;
}
nav.tabs button:hover{color:var(--text)}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
main{max-width:1280px;margin:0 auto;padding:26px 28px 80px}
.panel{display:none;animation:fadeUp .25s ease both}
.panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- content primitives ---------- */
.panel h2{font-size:21px;font-weight:600;letter-spacing:-.01em;margin:26px 0 10px}
.panel h2:first-child{margin-top:0}
.panel h3{font-size:16px;font-weight:600;margin:22px 0 8px}
.panel p{margin:8px 0;max-width:940px;color:var(--text)}
.panel ul,.panel ol{margin:8px 0 8px 22px;max-width:940px}
.panel li{margin:4px 0}
.dim{color:var(--text-dim)} .faint{color:var(--text-faint)}
code,.mono{font-family:var(--mono);font-size:.92em}
p code,li code,td code{background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;overflow-wrap:anywhere}
pre{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.5;margin:10px 0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin:12px 0}
.card.hero{border-color:var(--border-strong);background:linear-gradient(180deg,var(--accent-dim),var(--surface) 60%)}
.grid{display:grid;gap:14px;margin:12px 0}
/* 480px: enough for a 4-5 column table (path + two numbers + a 120px bar) at its
   minimum widths — below that the pair stacks instead of silently clipping columns.
   min(100%,...) lets the single remaining track shrink with a phone viewport
   instead of forcing page-level horizontal overflow */
.grid.cols-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr))}
.grid.cols-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid>*{min-width:0}
.kpis{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 18px;min-width:130px}
.kpi .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .l{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);margin-top:2px}
.kpi.warn .n{color:var(--warn)} .kpi.bad .n{color:var(--bad)} .kpi.good .n{color:var(--good)} .kpi.accent .n{color:var(--accent)}
.badge{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);vertical-align:1px;white-space:nowrap}
.badge.good{color:var(--good);background:var(--good-dim);border-color:transparent}
.badge.warn{color:var(--warn);background:var(--warn-dim);border-color:transparent}
.badge.bad{color:var(--bad);background:var(--bad-dim);border-color:transparent}
.badge.accent{color:var(--accent);background:var(--accent-dim);border-color:transparent}
.badge.neutral{color:var(--text-dim);background:var(--surface-2);border-color:transparent}
.callout{border-left:3px solid var(--accent);background:var(--accent-dim);border-radius:0 8px 8px 0;padding:12px 16px;margin:12px 0;max-width:940px}
.callout.warn{border-color:var(--warn);background:var(--warn-dim)}
.callout.bad{border-color:var(--bad);background:var(--bad-dim)}
.callout.good{border-color:var(--good);background:var(--good-dim)}
details{border:1px solid var(--border);border-radius:8px;margin:10px 0;background:var(--surface)}
details summary{cursor:pointer;padding:10px 16px;font-weight:500;color:var(--text-dim)}
details[open] summary{border-bottom:1px solid var(--border);color:var(--text)}
details .body{padding:12px 16px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;margin:12px 0;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
thead th{
  position:sticky;top:0;background:var(--surface-2);text-align:left;font-family:var(--mono);
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);
  padding:9px 14px;border-bottom:1px solid var(--border-strong);white-space:nowrap;
}
/* anywhere (not break-word): lets a long file path shrink the column under
   pressure, so numeric columns keep their width instead of being pushed out of
   the clip box — the paths give way, the numbers never do */
tbody td{padding:8px 14px;border-bottom:1px solid var(--border);vertical-align:top;overflow-wrap:anywhere}
tbody tr:last-child td{border-bottom:none}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
tbody tr:hover{background:var(--accent-dim)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
/* sortable-table arrows, .viz, .mermaid-wrap and the tooltip: assets/renderers.css */

/* CSS bars inside tables */
.bar{position:relative;background:var(--surface-2);border-radius:4px;height:14px;min-width:120px;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)} .bar.good>i{background:var(--good)}
/* diff add/del split bar: use two <i> with classes a and d */
.dbar{position:relative;display:flex;background:var(--surface-2);border-radius:4px;height:14px;min-width:120px;overflow:hidden}
.dbar>i.a{background:var(--add)} .dbar>i.d{background:var(--del)}
.plusminus{font-family:var(--mono);font-size:12px;white-space:nowrap}
.plusminus .p{color:var(--add)} .plusminus .m{color:var(--del)}
.diff-snippet{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.5;margin:10px 0}
.diff-snippet .fh{background:var(--surface-2);padding:6px 12px;border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text-dim)}
.diff-snippet .ln{display:block;padding:1px 12px;white-space:pre}
.diff-snippet .ln.add{background:var(--add-dim);color:var(--text)}
.diff-snippet .ln.del{background:var(--del-dim);color:var(--text)}
.diff-snippet .ln.ctx{color:var(--text-dim)}

footer.doc{max-width:1280px;margin:0 auto;padding:0 28px 34px;color:var(--text-faint);font-family:var(--mono);font-size:11.5px}
@media(max-width:720px){header.doc,main,nav.tabs,footer.doc{padding-left:16px;padding-right:16px} h1.doc-title{font-size:24px}}
</style>
</head>
<body>
<header class="doc">
  <div class="doc-label"><!--DOC_LABEL--></div>
  <h1 class="doc-title"><!--DOC_TITLE--></h1>
  <p class="doc-sub"><!--DOC_SUBTITLE--></p>
  <div class="doc-meta"><!--DOC_META--></div>
</header>
<nav class="tabs" role="tablist"><!--TABS_NAV--></nav>
<main><!--TABS_PANELS--></main>
<footer class="doc"><!--DOC_FOOTER--></footer>
<script>
/* ============ tabs ============ */
/* The tabs are the shell's. Everything a tab shows that needs script (sortable
   tables, graphs, treemaps, Mermaid) is assets/renderers.js, which assemble.py
   inlines into whichever shell it is given; this tab code dispatches the
   `tab:shown` event those renderers wait for. */
(function(){
  const btns=[...document.querySelectorAll('nav.tabs button')];
  const panels=[...document.querySelectorAll('.panel')];
  function activate(id,push){
    btns.forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===id?'true':'false'));
    panels.forEach(p=>p.classList.toggle('active',p.id===id));
    if(push){try{history.replaceState(null,'','#'+id)}catch(e){}}
    window.dispatchEvent(new CustomEvent('tab:shown',{detail:{id}}));
  }
  btns.forEach(b=>b.addEventListener('click',()=>activate(b.dataset.tab,true)));
  const initial=location.hash&&panels.some(p=>'#'+p.id===location.hash)?location.hash.slice(1):(panels[0]&&panels[0].id);
  if(initial)activate(initial,false);
  window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(panels.some(p=>p.id===h))activate(h,false);});
})();
</script>
</body>
</html>
