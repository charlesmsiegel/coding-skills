[project]
name = "coding-skills"
version = "0.1.0"
description = "Agentic skills to help with AI coding (stdlib-only detectors + judgment guides)"
# 3.12+: the code-visualization scripts use PEP 701 f-strings (nested same-quote
# expressions), which are a SyntaxError on 3.11.
requires-python = ">=3.12"
# The detectors are deliberately stdlib-only; there are no runtime dependencies.
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 120
# Eval fixtures are intentionally-bad code the skills are asked to criticize.
extend-exclude = ["evals/*/fixtures"]

[tool.ruff.lint]
# Correctness-focused floor (the ratchet starts here and only tightens):
# E4/E7/E9 = pycodestyle errors, F = pyflakes (undefined names, unused imports).
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# One tests/<skill>/ directory per skill; importlib mode keeps same-named test
# modules under different skill directories from colliding.
addopts = "--import-mode=importlib"
