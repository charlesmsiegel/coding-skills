name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # The detectors live in the python-code-doctor skill; they police every skill's code.
  DETECTORS: skills/python-code-doctor/scripts

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A skill runs against whatever interpreter the user already has, so the
        # declared floor (pyproject requires-python) is tested, not just assumed.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev tooling
        run: python -m pip install --quiet pytest ruff

      - name: Lint (ruff)
        run: ruff check .

      # The upload contract (frontmatter, naming, description limit) and the
      # skill/evals pairing. The release workflow runs this same script on the
      # skill it is about to package, so a tag cannot ship something a pull
      # request would have rejected.
      - name: Validate skill structure
        run: python tools/validate_skills.py

      # Output styles have their own frontmatter vocabulary and their own
      # silent failure: a style that omits `keep-coding-instructions` drops
      # Claude Code's built-in software engineering instructions, and nothing
      # at runtime says so.
      - name: Validate output style structure
        run: python tools/validate_styles.py

      # The two visualization skills each ship their own copy of the shared
      # scripts (a skill directory must be self-contained to be zipped alone).
      # README declares the copies byte-identical; this makes that invariant
      # real instead of aspirational.
      - name: Shared visualization files stay byte-identical
        run: |
          set -e
          CV=skills/code-visualization/scripts
          PR=skills/pr-visualization/scripts
          for f in common.py extract_tabs.py check_codemap_state.py \
                   verify_citations.py lint_fragments.py coverage_data.py \
                   resources.py llmops.py; do
            cmp "$CV/$f" "$PR/$f" || { echo "::error::$f has drifted between the two skills"; exit 1; }
          done
          # assemble.py differs in exactly one line: the --label default. Three
          # skills ship it — literature-survey assembles its report with the same
          # fragment protocol — so all three copies are compared, not just two.
          LS=skills/literature-survey/scripts
          if ! diff <(sed 's/PULL REQUEST REVIEW/CODEBASE ATLAS/' "$PR/assemble.py") "$CV/assemble.py"; then
            echo "::error::assemble.py copies differ beyond the --label default (pr-visualization)"
            exit 1
          fi
          if ! diff <(sed 's/LITERATURE SURVEY/CODEBASE ATLAS/' "$LS/assemble.py") "$CV/assemble.py"; then
            echo "::error::assemble.py copies differ beyond the --label default (literature-survey)"
            exit 1
          fi

      # django-code-doctor carries common.py and format_findings.py from
      # python-code-doctor for the same reason: it has to be installable on its own,
      # and the documented reporting pipe must work with no sibling present.
      - name: django-code-doctor's shared files match python-code-doctor's
        run: |
          set -e
          for f in common.py format_findings.py; do
            cmp "skills/python-code-doctor/scripts/$f" \
                "skills/django-code-doctor/scripts/$f" \
              || { echo "::error::$f has drifted between the two code-doctor skills"; exit 1; }
          done

      # The four documents in a code overview sit in one nav bar. Their design
      # tokens and letter bands are copied between skills (each skill directory
      # has to be installable alone), so the copies are pinned here rather than
      # trusted to stay aligned.
      - name: Document tokens and grade bands stay aligned across skills
        run: pytest tests/test_shared_assets.py -q

      - name: Smoke tests (every detector fires on its fixture, quiet on clean code)
        run: pytest -q

      # The ratchet (skills/python-code-doctor/references/messy-repo-runbook.md, Phase 5):
      # every bug-class detector is currently clean on this repo's own code, and it
      # stays that way. If one reports anything, a real defect class has crept back in.
      #
      # Findings only. A record marked `kind: "candidate"` is a lead a detector
      # could not prove from one file — a PRAGMA that has no parameterized
      # spelling, say — and failing the build on one would mean the only way to
      # get green is to rewrite correct code or suppress the detector.
      - name: Ratchet — bug-class detectors stay clean on our own code
        run: |
          set -e
          # Every skill that ships Python: scripts/ next to a SKILL.md.
          targets=$(for skill in skills/*/SKILL.md; do
            dir="$(dirname "$skill")/scripts"
            if [ -d "$dir" ]; then echo "$dir"; fi
          done)
          echo "Ratchet targets: $targets"
          failed=0
          for s in find_mutation_hazards find_exception_issues find_global_state \
                   find_resource_leaks find_security_issues find_debug_leftovers \
                   find_duplicate_definitions find_unawaited_coroutines \
                   find_local_imports find_import_cycles find_dependency_issues; do
            for target in $targets; do
              n=$(python "$DETECTORS/$s.py" "$target" --format json | python -c "import sys,json;print(sum(1 for r in json.load(sys.stdin) if r.get('kind') != 'candidate'))")
              if [ "$n" != "0" ]; then
                echo "::error::$s reports $n finding(s) on $target — the ratchet only tightens"
                python "$DETECTORS/$s.py" "$target"
                failed=1
              fi
            done
          done
          exit $failed

      - name: Full analyzer report (informational)
        run: |
          for skill in skills/*/SKILL.md; do
            dir="$(dirname "$skill")/scripts"
            [ -d "$dir" ] || continue
            echo "::group::$dir"
            python "$DETECTORS/analyze_all.py" "$dir" --skip-duplicates || true
            echo "::endgroup::"
          done
