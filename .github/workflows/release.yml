name: Release

on:
  push:
    # One release track per skill: tag <skill>-v<version>, e.g. python-simplifier-v0.1.0.
    tags: ["*-v*"]
  # Manual fallback: creates the tag (pointed at the dispatched ref) along
  # with the release, for environments that can't push tags directly.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. python-simplifier-v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      # The tag names the skill: everything before the trailing -v<version>.
      - name: Resolve skill from tag
        run: |
          skill="${TAG%-v*}"
          if [ "$skill" = "$TAG" ]; then
            echo "::error::tag '$TAG' is not of the form <skill>-v<version>"
            exit 1
          fi
          if [ ! -f "$skill/SKILL.md" ]; then
            echo "::error::tag '$TAG' names skill '$skill', but $skill/SKILL.md does not exist"
            exit 1
          fi
          echo "SKILL=$skill" >> "$GITHUB_ENV"

      # Mirror the upload contract enforced by the Skills API / claude.ai:
      # one SKILL.md with name + description frontmatter, description <= 1024 chars.
      - name: Validate SKILL.md frontmatter
        run: |
          python - "$SKILL/SKILL.md" <<'EOF'
          import re, sys
          content = open(sys.argv[1]).read()
          m = re.match(r"^---\n(.*?)\n---", content, re.DOTALL)
          assert m, f"{sys.argv[1]} has no YAML frontmatter"
          fm = m.group(1)
          name = re.search(r"^name:\s*(.+)$", fm, re.MULTILINE)
          desc = re.search(r"^description:\s*(.+)$", fm, re.MULTILINE)
          assert name and desc, "frontmatter must contain name and description"
          if len(desc.group(1)) > 1024:
              sys.exit(f"description is {len(desc.group(1))} chars; the Skills API limit is 1024")
          EOF

      # Package only the skill content (SKILL.md, LICENSE, references/, scripts/) —
      # not the repo's tests, CI config, or packaging metadata.
      - name: Build ${{ env.SKILL }}.skill
        run: |
          mkdir -p "stage/$SKILL"
          cp "$SKILL/SKILL.md" LICENSE "stage/$SKILL/"
          for dir in references scripts assets; do
            if [ -d "$SKILL/$dir" ]; then cp -r "$SKILL/$dir" "stage/$SKILL/"; fi
          done
          find stage -type d -name __pycache__ -prune -exec rm -rf {} +
          (cd stage && zip -r "../$SKILL.skill" "$SKILL")
          unzip -l "$SKILL.skill"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --target only applies when the tag doesn't exist yet (dispatch path).
          gh release create "$TAG" "$SKILL.skill" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Agent skill \`$SKILL\`. Download \`$SKILL.skill\` and install it in Claude Code (\`~/.claude/skills/\`) or upload it to claude.ai."
